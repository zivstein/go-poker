name: Ownership

# Judges a pull request's changed paths with master's own check and map. The pull request head is fetched only as
# Git data: it is never checked out, installed or executed. Rules: docs/ENGINEERING_PROCESS.md (Git and integration).
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  ownership:
    runs-on: ubuntu-latest

    steps:
      - name: Check out master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the pull request head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags --quiet origin "refs/pull/${PR_NUMBER}/head"

      - name: Check ownership
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          python3 scripts/check_ownership.py
          --base HEAD
          --head FETCH_HEAD
          --branch "$HEAD_REF"
          --base-ref "$BASE_REF"
          --head-repo "$HEAD_REPO"
          --repository "$REPOSITORY"
